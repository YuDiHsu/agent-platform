  # ----------------------------------------------------------------------------
  # 5. SA: 系統分析師 (System Analyst)
  # ----------------------------------------------------------------------------
  - code: "SA"
    name: "系統分析師 (System Analyst)"
    department: "RD"
    reports_to_code: "PM"
    visibility_scope: "GLOBAL"
    approval_status: "APPROVED"
    model_params:
      model: "gemma-4-27b-it"
      temperature: 0.1
      max_tokens: 6144
    allowed_tool_namespaces:
