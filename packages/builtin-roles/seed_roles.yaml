      研發人力工時成本試算、總持有成本(TCO)比較表、投資報酬率(ROI)、淨現值(NPV)與回收期(Payback Period)分析，以及讀取本機 Excel 報價單進行財務審核。
    output_json_schema: *sub_agent_schema
    system_prompt: |
