        "execution_status": "COMPLETED",
        "thought_process": "本任務無須先讀取外部檔案，可直接根據平台目標拆解『自建 Agent 與本機資料夾綁定』的功能規格，需特別強化『綁定本機資料夾之 Agent 強制鎖定為 PRIVATE 範圍』的業務驗證規則。",
        "tool_calls": [],
        "artifact_title": "使用者自建 Agent 與本機目錄掛載模組 - 系統需求規格書 (SRS)",
        "artifact_type": "REQUIREMENT_SPEC",
        "summary_200_words": "本規格定義自建 Agent 模組三大核心功能：(1) FR-01 一句話 Meta-Prompt 自動生成代理規格；(2) FR-02 瀏覽器本機資料夾授權與綁定註冊；(3) FR-03 權限範圍控管規則（凡綁定本機資料夾之 Agent 強制鎖定 visibility_scope = PRIVATE，禁止跨帳號呼叫）。內含完整欄位資料字典與 3 支核心 REST API 介面契約。",
        "full_markdown_content": "## 系統需求規格書 (Functional Specification)\n\n### 1. 功能需求清單 (Functional Requirements)\n\n| 需求編號 | 功能名稱 | 優先級 | 業務規則與驗收條件 (Given / When / Then) |\n| :--- | :--- | :--- | :--- |\n| **FR-001** | Meta-Prompt 規格自動生成 | P0 | **Given** 使用者輸入 10~500 字自然語言職責描述<br>**When** 點擊「AI 生成設定」<br>**Then** 系統呼叫 Gemma 4 回傳建議之 `system_prompt`、`routing_description` 與推薦工具清單 |\n| **FR-002** | 本機工作目錄授權與註冊 | P0 | **Given** 使用者使用 Chrome/Edge 瀏覽器<br>**When** 選擇本機資料夾並完成授權<br>**Then** 前端將 Handle 存入 IndexedDB，並將排除 `.env/.pem` 後之檔案相對路徑樹同步至後端 |\n| **FR-003** | 私有範圍強制鎖定 (Security Rule) | P0 | **Given** 使用者於自建 Agent 勾選綁定任一本機資料夾 (`bound_local_mount_id != null`)<br>**When** 嘗試將發布範圍設為 `DEPARTMENT` 或 `GLOBAL`<br>**Then** API 必須攔截並回傳 `400 Bad Request (ERR_LOCAL_MOUNT_MUST_BE_PRIVATE)` |\n\n### 2. 核心資料字典 (Data Dictionary - `agent_roles` 擴充欄位)\n\n| 欄位名稱 | 型別 | 必填 | 預設值 | 業務邏輯與驗證規則 |\n| :--- | :--- | :--- | :--- | :--- |\n| `creator_user_id` | UUID | 否 | NULL | 系統內建角色為 NULL；使用者自建角色必填當前登入者 UUID |\n| `visibility_scope` | VARCHAR(20) | 是 | `'PRIVATE'` | 枚舉值：`PRIVATE`, `DEPARTMENT`, `GLOBAL` |\n| `bound_local_mount_id` | UUID | 否 | NULL | 外鍵關聯 `local_workspace_mounts.id`；非空時強制 `visibility_scope = 'PRIVATE'` |\n\n### 3. API 介面契約 (API Contracts)\n- **`POST /api/v1/agents`**\n  - **Request Body**: `{ \"name\": \"string\", \"system_prompt\": \"string\", \"routing_description\": \"string\", \"visibility_scope\": \"PRIVATE\", \"bound_local_mount_id\": \"uuid | null\" }`\n  - **Success Response (201)**: `{ \"id\": \"uuid\", \"code\": \"CUSTOM_...\", \"approval_status\": \"APPROVED\" }`\n  - **Error Response (400)**: `{ \"error_code\": \"ERR_LOCAL_MOUNT_MUST_BE_PRIVATE\", \"message\": \"綁定本機資料夾之代理僅限個人私有使用\" }`",
        "handoff_notes_for_next_role": "請 ARCH 根據 FR-002 與 FR-003 設計瀏覽器與 FastAPI 之間的 WebSocket Reverse RPC 通訊序列圖與安全邊界；請 SE 實作 400 錯誤攔截與 DB Check Constraint。"
      }
