  # ----------------------------------------------------------------------------
  # 6. ARCH: 架構分析師 (Architecture Analyst)
  # ----------------------------------------------------------------------------
  - code: "ARCH"
    name: "架構分析師 (Architecture Analyst)"
    department: "RD"
    reports_to_code: "PM"
    visibility_scope: "GLOBAL"
    approval_status: "APPROVED"
    model_params:
