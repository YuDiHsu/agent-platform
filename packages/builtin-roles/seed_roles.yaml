        "full_markdown_content": "## 專案 TCO 與 ROI 財務評估報告\n\n### 1. 建置與維運成本結構 (CapEx & Annual OpEx)\n*(假設基準：研發綜合人月成本以 NT$ 150,000/人月 估算；開源軟體授權費為 NT$ 0)*\n\n| 成本項目 | 類別 | 數量 / 規模 | 單價基準 (NT$) | 小計 (NT$) | 備註 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **PM / SA / ARCH 規劃人力** | 一次性開發 | 4 人月 (8週) | 150,000 | 600,000 | 需求、架構與驗收 |\n| **資深工程師 (SE) 實作人力** | 一次性開發 | 4 人月 (8週) | 150,000 | 600,000 | 前後端與 MCP 串接 |\n| **本地 Gemma 4 GPU 算力分攤** | 年度攤提 | 1 節點 (分攤) | 20,000 / 月 | 240,000 | 3 年折舊與機房電力 |\n| **開源框架與模型授權** | 軟體授權 | 全套 (MIT/Apache) | 0 | 0 | 零商業授權費 |\n| **首年總持有成本 (Year-1 TCO)** | **總計** | — | — | **1,440,000** | — |\n\n### 2. 三情境投資報酬率 (ROI) 分析\n\n| 評估指標 | 保守情境 (50人使用) | 基準情境 (100人使用) | 樂觀情境 (200人使用) |\n| :--- | :--- | :--- | :--- |\n| **年節省總工時** | 6,500 小時 | 13,000 小時 | 26,000 小時 |\n| **折算年化財務效益** | NT$ 1,625,000 | NT$ 3,250,000 | NT$ 6,500,000 |\n| **首年淨效益 (Net Benefit)** | NT$ 185,000 | NT$ 1,810,000 | NT$ 5,060,000 |\n| **首年 ROI (%)** | **+12.8%** | **+125.7%** | **+351.4%** |\n| **投資回收期 (Payback)** | **10.6 個月** | **5.3 個月** | **2.7 個月** |",
